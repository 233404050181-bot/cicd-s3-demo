
name: CI-CD-S3-Static-Website

on:
  push:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build and Test
        run: |
          test -f site/index.html
          if grep -q "THAY_TEN_BAN" site/index.html; then
            echo "ERROR: Ban chua thay THAY_TEN_BAN trong index.html"
            exit 1
          fi
          echo "Build/Test thanh cong"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Deploy len S3
        run: aws s3 sync site/ s3://cicd-web-khoi-2025 --delete

